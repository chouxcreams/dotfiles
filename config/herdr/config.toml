onboarding = false
# herdr configuration
# tmux.confのキーバインドと同等の操作を再現する

[keys]
# Alt + hjkl でペイン移動 (tmux: bind -n M-h/j/k/l select-pane)
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]

# Alt + f でペインのズームトグル (tmux: bind -n M-f resize-pane -Z)
zoom = ["prefix+z", "alt+f"]

# Alt + ←→ / Alt + Shift + h/l でタブ移動
# (tmux: bind -n M-left/M-right, M-H/M-L previous-window/next-window)
previous_tab = ["prefix+p", "alt+left", "alt+shift+h"]
next_tab = ["prefix+n", "alt+right", "alt+shift+l"]

# prefix + space でナビゲーターを開く (デフォルトの prefix+g も維持)
goto = ["prefix+g", "prefix+space"]

# Alt + tab / Alt + Shift + tab でワークスペース切り替え
next_workspace = "alt+tab"
previous_workspace = "alt+shift+tab"

# lazygitをポップアップで起動 (tmux: bind \; / bind -n M-d)
# lazygit上でbunを正しく開くためにbunのpathを渡す
[[keys.command]]
key = "prefix+semicolon"
type = "popup"
command = 'cd "$HERDR_ACTIVE_PANE_CWD" && PATH="$HOME/.cache/.bun/bin:$PATH" mise exec -- lazygit'
description = "lazygit"
width = "95%"
height = "95%"

[[keys.command]]
key = "alt+g"
type = "popup"
command = 'cd "$HERDR_ACTIVE_PANE_CWD" && PATH="$HOME/.cache/.bun/bin:$PATH" mise exec -- lazygit'
description = "lazygit"
width = "95%"
height = "95%"

# yaziをポップアップで起動
[[keys.command]]
key = "alt+y"
type = "popup"
command = 'cd "$HERDR_ACTIVE_PANE_CWD" && yazi'
description = "yazi"
width = "95%"
height = "95%"

# [[keys.command]]
# key = "alt+g"
# type = "popup"
# command = 'cd "$HERDR_ACTIVE_PANE_CWD" && herdr-dashboard'
# description = "dashboard"
# width = "95%"
# height = "95%"

# フォーカス中ペインのURLをポップアップで選択して開く (herdr-url-picker)
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chouxcreams.url-picker.pick"
description = "pick URL from focused pane"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "chouxcreams.url-picker.copy-bang"
description = "!から始まる行をコピー"

[[keys.command]]
key = "alt+d"
type = "plugin_action"
command = "chouxcreams.herdr-dashboard.open"
description = "ダッシュボードを開く"

[ui]
# マウス操作を有効にする (tmux: set-option -g mouse on)
mouse_capture = true
